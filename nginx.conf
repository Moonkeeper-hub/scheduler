server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log off;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location / { try_files $uri $uri/ =404; }
}
